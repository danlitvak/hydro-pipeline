[project]
name = "hydro-pipeline"
version = "0.1.0"
description = "BC hydrometric data pipeline: ECCC API ingest, SQLite storage, rolling statistics and z-score anomaly detection, Plotly/folium reporting"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Daniel Litvak" }]
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "plotly>=5.18",
    "folium>=0.15",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hydro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
